user nginx;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr info;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    access_log /dev/stdout;
    client_body_temp_path /var/lib/nginx/tmp/client;
    fastcgi_temp_path /var/lib/nginx/tmp/fastcgi;
    proxy_temp_path /var/lib/nginx/tmp/proxy;
    scgi_temp_path /var/lib/nginx/tmp/scgi;
    uwsgi_temp_path /var/lib/nginx/tmp/uwsgi;

    # The host-only injection helper may place one deliberately invalid file
    # here. The running endpoint remains available until a validation/reload.
    include /fixture-state/inject/nginx/*.conf;

    server {
        listen 80;
        server_name certbaton-fixture.test;

        location = /healthz {
            default_type text/plain;
            return 200 "fixture-http-ok\n";
        }

        location ^~ /.well-known/acme-challenge/ {
            root /srv/certbaton/webroot;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            root /srv/certbaton/webroot;
            try_files $uri /index.html =404;
        }
    }

    server {
        listen 443 ssl;
        server_name certbaton-fixture.test;

        ssl_certificate /srv/certbaton/tls/active/fullchain.pem;
        ssl_certificate_key /srv/certbaton/tls/active/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header X-CertBaton-Fixture true always;

        location = /healthz {
            default_type text/plain;
            return 200 "fixture-tls-ok\n";
        }

        location / {
            root /srv/certbaton/webroot;
            try_files $uri /index.html =404;
        }
    }
}
