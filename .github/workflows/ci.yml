name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (.NET 10 / Windows)
    runs-on: windows-2025
    timeout-minutes: 20

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.302
          cache: ${{ hashFiles('**/packages.lock.json') != '' }}
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore
        run: dotnet restore CertBaton.slnx --locked-mode

      - name: Build
        run: dotnet build CertBaton.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CertBaton.slnx --configuration Release --no-build --no-restore --logger "trx;LogFileName=test-results.trx"
