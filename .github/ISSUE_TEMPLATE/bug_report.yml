name: Bug report
description: Report reproducible pre-alpha behavior using synthetic or redacted data
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        CertBaton is pre-alpha. Never include credentials, private keys, challenge values, private host details, or unredacted logs. Report suspected vulnerabilities through the private process in SECURITY.md.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, customer data, private infrastructure details, and certificate private keys.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Use a local fixture or synthetic data and include the smallest safe sequence.
      placeholder: |
        1. Start...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
      placeholder: Commit SHA or pre-release version
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows environment
      options:
        - Windows 11 x64
        - Other or unqualified
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Paste only minimal, manually reviewed output that contains no sensitive data.
